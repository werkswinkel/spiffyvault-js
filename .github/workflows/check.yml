name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit --workspace @spiffyvault/payments
      - name: Browser bundle has no Node built-ins
        run: npm run check:bundle --workspace @spiffyvault/payments
